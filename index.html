<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4f46e5,#9333ea);
padding:30px;
transition:.3s;
}

body.dark{
background:#0f172a;
}

.container{
width:100%;
max-width:700px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(20px);
padding:30px;
border-radius:25px;
color:white;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

h1{
text-align:center;
margin-bottom:25px;
}

.top{
display:flex;
gap:10px;
margin-bottom:20px;
}

.top input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
outline:none;
font-size:16px;
}

.top button{
padding:15px 22px;
border:none;
border-radius:12px;
cursor:pointer;
background:white;
font-weight:bold;
}

.search{
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-bottom:20px;
outline:none;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.15);
padding:15px;
border-radius:15px;
text-align:center;
}

.filters{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.filters button{
padding:10px 18px;
border:none;
border-radius:10px;
cursor:pointer;
}

ul{
list-style:none;
}

.task{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.15);
padding:15px;
border-radius:15px;
margin-bottom:12px;
animation:fade .35s;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.done{
text-decoration:line-through;
opacity:.6;
}

.actions button{
margin-left:5px;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.dark-btn{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
cursor:pointer;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:650px){

.stats{
grid-template-columns:1fr;
}

.top{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="container">

<h1>📋 Task Manager</h1>

<div class="top">
<input id="taskInput" placeholder="New Task...">
<button id="addBtn">Add</button>
</div>

<input class="search" id="search" placeholder="Search...">

<div class="stats">

<div class="card">
<h2 id="total">0</h2>
<p>Total</p>
</div>

<div class="card">
<h2 id="done">0</h2>
<p>Done</p>
</div>

<div class="card">
<h2 id="pending">0</h2>
<p>Pending</p>
</div>

</div>

<div class="filters">

<button data-filter="all">All</button>
<button data-filter="done">Done</button>
<button data-filter="pending">Pending</button>

</div>

<ul id="taskList"></ul>

<button class="dark-btn" id="themeBtn">
🌙 Dark Mode
</button>

</div>
<script>

const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const search = document.getElementById("search");
const themeBtn = document.getElementById("themeBtn");

const total = document.getElementById("total");
const done = document.getElementById("done");
const pending = document.getElementById("pending");

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let filter = "all";

function save(){
    localStorage.setItem("tasks",JSON.stringify(tasks));
}

function updateStats(){
    total.textContent = tasks.length;
    done.textContent = tasks.filter(t=>t.done).length;
    pending.textContent = tasks.filter(t=>!t.done).length;
}

function render(){

    taskList.innerHTML="";

    let list=[...tasks];

    if(filter==="done"){
        list=list.filter(t=>t.done);
    }

    if(filter==="pending"){
        list=list.filter(t=>!t.done);
    }

    const keyword=search.value.toLowerCase();

    list=list.filter(t=>t.text.toLowerCase().includes(keyword));

    list.forEach(task=>{

        const li=document.createElement("li");
        li.className="task";

        li.innerHTML=`

        <div class="left">

            <input type="checkbox"
            ${task.done?"checked":""}
            onchange="toggleTask(${task.id})">

            <span class="${task.done?"done":""}">
            ${task.text}
            </span>

        </div>

        <div class="actions">

            <button onclick="editTask(${task.id})">
            ✏️
            </button>

            <button onclick="deleteTask(${task.id})">
            🗑️
            </button>

        </div>`

        ;

        taskList.appendChild(li);

    });

    updateStats();
    save();

}

addBtn.onclick=()=>{

    const value=taskInput.value.trim();

    if(value==="") return;

    tasks.unshift({

        id:Date.now(),

        text:value,

        done:false

    });

    taskInput.value="";

    render();

}

taskInput.addEventListener("keypress",e=>{

    if(e.key==="Enter"){

        addBtn.click();

    }

});

function deleteTask(id){

    tasks=tasks.filter(t=>t.id!==id);

    render();

}

function toggleTask(id){

    tasks=tasks.map(task=>{

        if(task.id===id){

            task.done=!task.done;

        }

        return task;

    });

    render();

}

function editTask(id){

    const task=tasks.find(t=>t.id===id);

    const value=prompt("Edit Task",task.text);

    if(value===null) return;

    task.text=value;

    render();

}

search.addEventListener("input",render);

document.querySelectorAll("[data-filter]").forEach(btn=>{

    btn.onclick=()=>{

        filter=btn.dataset.filter;

        render();

    }

});

themeBtn.onclick=()=>{

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
    );

}

if(localStorage.getItem("theme")==="true"){

    document.body.classList.add("dark");

}

render();

</script>

</body>
</html>
